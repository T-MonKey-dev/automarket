
name:
  automarket

services:
  database:
    image: postgres:17
    container_name: automarket-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    
    ports:
     - "5434:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    networks: 
      - automarket_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 30s
  
  redis:
    image: redis:7
    container_name: automarket-redis
    restart: unless-stopped

    ports:
      - "6380:6379"
    
    volumes:
      - redis_data:/data

    networks:
      - automarket_network 
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s 
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:

networks:
  automarket_network:
    driver: bridge